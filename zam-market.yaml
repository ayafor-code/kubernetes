Checks:

# 1. Label the workers (only changes what the ROLES column shows)
kubectl label node node2 node-role.kubernetes.io/worker=
kubectl label node node7 node-role.kubernetes.io/worker=

# 2. Check the system pods: coredns and kube-flannel should all be Running
kubectl get pods -A

# 3. Smoke test: pods spread across the workers, reachable via NodePort
kubectl create deploy nginx --image=nginx --replicas=2
kubectl expose deploy nginx --port=80 --type=NodePort
kubectl get pods -o wide        # should land on node2 and node7
kubectl get svc nginx           # note the 3xxxx port
curl http://<node2-private-ip>:<nodeport>   # should return the nginx welcome page

# 4. Check DNS works between pods
kubectl run dnstest --image=busybox:1.36 --rm -it --restart=Never -- nslookup kubernetes.default

