apiVersion: v1
kind: Namespace
metadata:
  name: zam-market
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: zam-market-html
  namespace: zam-market
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Zam Market</title>
      <style>
        body { margin:0; font-family: Arial, sans-serif; background:#f4f6f8; color:#222; }
        header { background:#1b7f3b; color:#fff; padding:24px; text-align:center; }
        header h1 { margin:0; font-size:2.2em; }
        .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; padding:24px; max-width:1000px; margin:auto; }
        .card { background:#fff; border-radius:8px; padding:20px; box-shadow:0 2px 6px rgba(0,0,0,.08); text-align:center; }
        .price { color:#1b7f3b; font-weight:bold; font-size:1.2em; }
        footer { text-align:center; padding:16px; color:#666; font-size:.9em; }
      </style>
    </head>
    <body>
      <header>
        <h1>Zam Market</h1>
        <p>Fresh produce, delivered</p>
      </header>
      <div class="grid">
        <div class="card"><h3>Plantains</h3><p class="price">1,500 FCFA</p></div>
        <div class="card"><h3>Tomatoes (1 kg)</h3><p class="price">800 FCFA</p></div>
        <div class="card"><h3>Avocados</h3><p class="price">500 FCFA</p></div>
        <div class="card"><h3>Pineapple</h3><p class="price">700 FCFA</p></div>
      </div>
      <footer>Served by pod: <b>POD_NAME</b></footer>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zam-market
  namespace: zam-market
  labels:
    app: zam-market
spec:
  replicas: 2
  selector:
    matchLabels:
      app: zam-market
  template:
    metadata:
      labels:
        app: zam-market
    spec:
      initContainers:
        # Copies the page and stamps in the pod name, so you can see load balancing
        - name: render-page
          image: busybox:1.36
          command: ["sh", "-c", "sed \"s/POD_NAME/$POD_NAME/\" /src/index.html > /html/index.html"]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: src
              mountPath: /src
            - name: html
              mountPath: /html
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: src
          configMap:
            name: zam-market-html
        - name: html
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: zam-market
  namespace: zam-market
spec:
  type: NodePort
  selector:
    app: zam-market
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
